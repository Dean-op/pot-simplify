[package]
name = "pot"
version = "0.0.0"
description = "Pot App"
authors = ["pot-app"]
license = "GPL-3.0-only"
repository = "https://github.com/pot-app/pot-desktop"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]

tauri = { version = "1.8", features = [ "fs-all", "protocol-asset", "shell-all", "clipboard-all", "http-all", "http-multipart", "notification-all", "global-shortcut-all", "window-all", "path-all", "system-tray", "devtools"] }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-fs-watch = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
serde = { version = "1.0", features = ["derive"] }
selection = "1.2.0"
serde_json = "1.0"
dirs = "5.0.1"
once_cell = "1.19.0"
mouse_position = "0.1.4"
log = "0.4"
screenshots = "=0.7.2"
base64 = "0.22"
arboard = "3.4"
# 语种只留中日英（Dean 的常用语言）。模型是 include_dir! 嵌进二进制的
# brotli 数据，22 个语种合计 20.12 MB，这三个 1.18 MB。
# 改这里必须同步改 src/lang_detect.rs 的 LANGUAGES 数组和 match 分支——
# Language 枚举的变体就是由这些 feature 决定的。
lingua = { version = "1.6.2", default-features = false, features = ["chinese", "japanese", "english"] }
thiserror = "1.0"
font-kit = "0.14.2"
image = "0.25.4"

[target.'cfg(windows)'.dependencies]
windows = {version="0.58.0",features= ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Graphics_Imaging", "Media_Ocr", "Foundation", "Globalization", "Storage", "Storage_Streams"] }
window-shadows = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
#openssl

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# 原本没有这一段，走的是 Cargo 默认（opt-level = 3、lto = false、
# codegen-units = 16、不 strip）。代价是 release 构建时间大约翻倍。
# 没加 panic = "abort"：代码里 .unwrap() 不少，unwind 掉一个窗口
# 比整个进程被 abort 好收场。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
