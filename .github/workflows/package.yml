name: Package
on:
    push:
        branches: [master]
        tags: ['v*']
    # 手动触发，不用为了拿一个安装包专门推一次 commit
    workflow_dispatch:
        inputs:
            release_tag:
                description: '重建并发布已有标签（例如 v3.2.1）；留空仅构建当前分支'
                required: false
                type: string
# 只需要建 Release 和上传产物的权限
permissions:
    contents: write

jobs:
    verify:
        runs-on: windows-latest
        steps:
            - name: Validate Rebuild Tag
              env:
                  RELEASE_TAG: ${{ inputs.release_tag }}
              run: |
                  if ($env:RELEASE_TAG -and $env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
                      throw 'release_tag 必须是已有的 vX.Y.Z 标签'
                  }
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: dtolnay/rust-toolchain@stable
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Test Frontend
              run: pnpm test
            - name: Test Rust
              run: cargo test --manifest-path src-tauri/Cargo.toml --locked
            - name: Checkout Workflow Tools
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  path: .ci-tools
                  sparse-checkout: .scripts/download-release-asset*.mjs
                  sparse-checkout-cone-mode: false
            - name: Test Download Helper
              run: node --test .ci-tools/.scripts/download-release-asset.test.mjs

    change-version:
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        needs: verify
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.outputstep.outputs.VERSION }}
            release_tag: ${{ steps.outputstep.outputs.RELEASE_TAG }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

            # 修复 CI 后可重建原标签源码，不移动标签，也不拿 master 冒充旧版本。
            - id: outputstep
              env:
                  REQUESTED_TAG: ${{ inputs.release_tag }}
              run: |
                  if [[ -n "$REQUESTED_TAG" ]]; then
                      RELEASE_TAG="$REQUESTED_TAG"
                  elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                      RELEASE_TAG="${GITHUB_REF#refs/tags/}"
                  else
                      RELEASE_TAG=""
                  fi
                  VERSION=$(node -p "require('./package.json').version")
                  if [[ -n "$RELEASE_TAG" ]]; then
                      VERSION="${RELEASE_TAG#v}"
                      test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
                  echo "构建源码：$(git rev-parse HEAD)，发布标签：$RELEASE_TAG"
            - name: Validate Version
              env:
                  VERSION: ${{ steps.outputstep.outputs.VERSION }}
              run: |
                  node .scripts/check-version.mjs "$VERSION"

            - name: Upload Artifacts for Windows
              uses: actions/upload-artifact@v4
              with:
                  name: source
                  path: |
                      ./*
                      !./.git/**
                  include-hidden-files: true
                  if-no-files-found: error
            - name: Checkout Workflow Tools
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  path: .ci-tools
                  sparse-checkout: .scripts/download-release-asset.mjs
                  sparse-checkout-cone-mode: false
            - name: Upload Workflow Tools
              uses: actions/upload-artifact@v4
              with:
                  name: ci-tools
                  path: .ci-tools/.scripts/download-release-asset.mjs
                  include-hidden-files: true
                  if-no-files-found: error

    build-for-windows:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
                    - os: windows-latest
                      target: i686-pc-windows-msvc
                      toolchain: stable-i686-pc-windows-msvc
                    - os: windows-latest
                      target: aarch64-pc-windows-msvc
                      toolchain: stable-aarch64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - uses: actions/download-artifact@v4
              with:
                  name: ci-tools
                  path: .ci-tools
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Prepare NSIS Tools
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  $cache = Join-Path $env:LOCALAPPDATA 'tauri'
                  New-Item -ItemType Directory -Path $cache -Force | Out-Null
                  node .ci-tools/download-release-asset.mjs tauri-apps/binary-releases nsis-3 nsis-3.zip "$cache/nsis-3.zip" 057e83c7d82462ec394af76c87d06733605543d4
                  if ($LASTEXITCODE -ne 0) { throw 'NSIS 下载或校验失败' }
                  Expand-Archive -LiteralPath "$cache/nsis-3.zip" -DestinationPath $cache
                  Rename-Item -LiteralPath "$cache/nsis-3.08" -NewName NSIS
                  node .ci-tools/download-release-asset.mjs tauri-apps/nsis-tauri-utils nsis_tauri_utils-v0.4.1 nsis_tauri_utils.dll "$cache/NSIS/Plugins/x86-unicode/nsis_tauri_utils.dll" F99A50209A345185A84D34D0E5F66D04C75FF52F
                  if ($LASTEXITCODE -ne 0) { throw 'NSIS 插件下载或校验失败' }
            - name: Build and Package
              run: pnpm tauri build -b nsis --target ${{ matrix.target }}
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error

    build-for-windows-fix-runtime:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      arch: x64
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
                    - os: windows-latest
                      arch: x86
                      target: i686-pc-windows-msvc
                      toolchain: stable-i686-pc-windows-msvc
                    - os: windows-latest
                      arch: arm64
                      target: aarch64-pc-windows-msvc
                      toolchain: stable-aarch64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - uses: actions/download-artifact@v4
              with:
                  name: ci-tools
                  path: .ci-tools
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Prepare NSIS Tools
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  $cache = Join-Path $env:LOCALAPPDATA 'tauri'
                  New-Item -ItemType Directory -Path $cache -Force | Out-Null
                  node .ci-tools/download-release-asset.mjs tauri-apps/binary-releases nsis-3 nsis-3.zip "$cache/nsis-3.zip" 057e83c7d82462ec394af76c87d06733605543d4
                  if ($LASTEXITCODE -ne 0) { throw 'NSIS 下载或校验失败' }
                  Expand-Archive -LiteralPath "$cache/nsis-3.zip" -DestinationPath $cache
                  Rename-Item -LiteralPath "$cache/nsis-3.08" -NewName NSIS
                  node .ci-tools/download-release-asset.mjs tauri-apps/nsis-tauri-utils nsis_tauri_utils-v0.4.1 nsis_tauri_utils.dll "$cache/NSIS/Plugins/x86-unicode/nsis_tauri_utils.dll" F99A50209A345185A84D34D0E5F66D04C75FF52F
                  if ($LASTEXITCODE -ne 0) { throw 'NSIS 插件下载或校验失败' }
            - name: Download WebView2 Runtime
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  node .ci-tools/download-release-asset.mjs westinyang/WebView2RuntimeArchive 109.0.1518.78 Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab
                  if ($LASTEXITCODE -ne 0) { throw 'WebView2 下载或校验失败' }
                  Expand .\Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -F:* ./src-tauri
                  if ($LASTEXITCODE -ne 0) { throw 'WebView2 解压失败' }
                  Remove-Item -LiteralPath .\src-tauri\tauri.windows.conf.json
                  Rename-Item -LiteralPath .\src-tauri\webview.${{ matrix.arch }}.json -NewName tauri.windows.conf.json
            - name: Build and Package
              run: |
                  pnpm tauri build -b nsis --target ${{ matrix.target }}
                  # 不写死 pot-simplify_<版本>_<arch>-setup.exe：产物名由 tauri.conf.json 的
                  # productName 和版本号拼出来，写死过一次就得跟着改一次。按后缀找唯一那个 exe。
                  $nsis = ".\src-tauri\target\${{ matrix.target }}\release\bundle\nsis"
                  $setup = @(Get-ChildItem "$nsis\*-setup.exe" -File)
                  if ($setup.Count -ne 1) { throw "期望 1 个 setup.exe，实际 $($setup.Count) 个" }
                  Rename-Item $setup[0].FullName ($setup[0].Name -replace '-setup\.exe$', '_fix_webview2_runtime-setup.exe')
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_fix_webview_runtime_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error

    publish:
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        needs: [change-version, build-for-windows, build-for-windows-fix-runtime]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: refs/tags/${{ needs.change-version.outputs.release_tag }}
            - uses: actions/download-artifact@v4
              with:
                  pattern: windows_*
                  path: installers
                  merge-multiple: true
            - name: Prepare Release Notes
              env:
                  VERSION: ${{ needs.change-version.outputs.version }}
              run: |
                  awk -v header="## [$VERSION]" '
                      index($0, header) == 1 { capture = 1; next }
                      capture && /^## / { exit }
                      capture { print }
                  ' CHANGELOG.md > release-notes.md
                  test -s release-notes.md
                  COUNT=$(find installers -name '*-setup.exe' -type f | wc -l)
                  test "$COUNT" -eq 6
            - name: Publish Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.change-version.outputs.release_tag }}
                  body_path: release-notes.md
                  fail_on_unmatched_files: true
                  files: installers/*-setup.exe
