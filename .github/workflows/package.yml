name: Package
on:
    push:
        branches: [master]
    # 手动触发，不用为了拿一个安装包专门推一次 commit
    workflow_dispatch:
# 只需要建 Release 和上传产物的权限
permissions:
    contents: write

jobs:
    change-version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.outputstep.outputs.VERSION }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 版本号优先取最近的 tag，没有 tag 就沿用 package.json 里的值。
            # 上游原来是直接 `git describe --tags`，仓库里一个 tag 都没有时它会失败，
            # 但外层是 echo，步骤照样绿灯，结果把空字符串写进 tauri.conf.json，
            # 到 tauri build 才报 `package > version` must be a semver string。
            - id: outputstep
              run: |
                  VERSION=$(git describe --tags --abbrev=0 2>/dev/null || true)
                  VERSION=${VERSION#v}
                  if [ -z "$VERSION" ]; then
                      VERSION=$(node -p "require('./package.json').version")
                      echo "没有 tag，沿用 package.json 里的版本号 $VERSION"
                  fi
                  if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::版本号 '$VERSION' 不是 x.y.z 形式，tauri 会拒绝"
                      exit 1
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
            - name: Change Version for Windows
              env:
                  VERSION: ${{ steps.outputstep.outputs.VERSION }}
              run: |
                  sed -i "s/\"version\":.*/\"version\": \"$VERSION\",/" package.json
                  sed -i "s/\"version\":.*/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
                  sed -i "s/version = \"0.0.0\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

            - name: Upload Artifacts for Windows
              uses: actions/upload-artifact@v4
              with:
                  name: source
                  path: ./*
                  include-hidden-files: true
                  if-no-files-found: error

    build-for-windows:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
                    - os: windows-latest
                      target: i686-pc-windows-msvc
                      toolchain: stable-i686-pc-windows-msvc
                    - os: windows-latest
                      target: aarch64-pc-windows-msvc
                      toolchain: stable-aarch64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install
            - name: Code Format
              run: pnpm prettier --write .
            - name: Build and Package
              run: pnpm tauri build -b nsis --target ${{ matrix.target }}
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  generate_release_notes: true
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*

    build-for-windows-fix-runtime:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      arch: x64
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
                    - os: windows-latest
                      arch: x86
                      target: i686-pc-windows-msvc
                      toolchain: stable-i686-pc-windows-msvc
                    - os: windows-latest
                      arch: arm64
                      target: aarch64-pc-windows-msvc
                      toolchain: stable-aarch64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install
            - name: Code Format
              run: pnpm prettier --write .
            - name: Download WebView2 Runtime
              run: |
                  invoke-webrequest -uri https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -outfile Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab
                  Expand .\Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -F:* ./src-tauri
                  Remove-Item .\src-tauri\tauri.windows.conf.json
                  Rename-Item .\src-tauri\webview.${{ matrix.arch }}.json tauri.windows.conf.json
            - name: Build and Package
              run: |
                  pnpm tauri build -b nsis --target ${{ matrix.target }}
                  # 不写死 pot-simplify_<版本>_<arch>-setup.exe：产物名由 tauri.conf.json 的
                  # productName 和版本号拼出来，写死过一次就得跟着改一次。按后缀找唯一那个 exe。
                  $nsis = ".\src-tauri\target\${{ matrix.target }}\release\bundle\nsis"
                  $setup = @(Get-ChildItem "$nsis\*-setup.exe" -File)
                  if ($setup.Count -ne 1) { throw "期望 1 个 setup.exe，实际 $($setup.Count) 个" }
                  Rename-Item $setup[0].FullName ($setup[0].Name -replace '-setup\.exe$', '_fix_webview2_runtime-setup.exe')
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_fix_webview_runtime_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  generate_release_notes: true
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
